<body data-game="charades">
  <header class="site-header">
    <a class="back" href="../">← 게임 목록</a>
    <h1>🤸 몸으로 말해요</h1>
    <span class="spacer"></span>
  </header>
  <main class="game" id="app"></main>

<script src="../assets/common.js?v=b8e111b3"></script>
<script src="../assets/teamround.js?v=3f0a674f"></script>
<script src="words.js?v=623b72bf"></script>
<script>
TeamRound.start({
  key: 'charades', emoji: '🤸', mode: 'act', timeOptions: [60, 90, 120], defaultTime: 60,
  intro: '한 사람이 단어를 보고 말 없이 몸으로만 설명해요.\n같은 팀이 시간 안에 최대한 많이 맞혀 보세요!',
  readyNote: '휴대폰은 연기하는 사람이 받아 주세요.\n(말하기, 소리 내기, 글자 쓰기는 금지)',
  countNote: '연기자는 화면을 가리고 준비하세요!',
  cats: window.CHARADES_DATA.map(function (c) {
    return { name: c.cat, emoji: c.emoji, group: c.group, items: c.words.split(',').map(function (w) { return { w: w.trim() }; }) };
  })
});
</script>
