<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=2966e46c">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/icons/icon.svg?v=ce2c3834">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon-180.png?v=8fe226b3">
  <link rel="manifest" href="../manifest.webmanifest?v=bb8c639b">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="미니게임">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OX 퀴즈 · Mini Games</title>
  <meta name="description" content="큰 화면으로 함께 즐기는 OX 퀴즈. 성경, 일반 상식, 과학, 한국 문화·역사 문제와 해설이 있어요.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../assets/style.css?v=fc901d82">
  <style>
    main.game.wide { max-width: 860px; }
    .ox-q {
      background: var(--surface); border: 3px solid var(--accent); border-radius: 24px; padding: 28px 18px; margin: 10px 0;
      min-height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; box-shadow: var(--shadow);
    }
    .ox-q .cat { font-size: .85rem; font-weight: 700; color: var(--muted); }
    .ox-q .t { font-size: clamp(1.45rem, 5.2vw, 2.6rem); font-weight: 800; line-height: 1.4; word-break: keep-all; }
    .ox-ans { display: flex; gap: 12px; margin: 10px 0; }
    .ox-ans .sym {
      flex: 1; display: grid; place-items: center; font-size: clamp(4rem, 18vw, 8rem); font-weight: 900; line-height: 1.2; border-radius: 24px;
      border: 4px solid var(--border); background: var(--surface-2); color: var(--muted); opacity: .55; transition: all .3s;
    }
    .ox-ans .sym.o { color: #2563eb; }
    .ox-ans .sym.x { color: #ef4444; }
    .ox-ans.revealed .sym.win { opacity: 1; transform: scale(1.04); background: var(--surface); }
    .ox-ans.revealed .sym.o.win { border-color: #2563eb; }
    .ox-ans.revealed .sym.x.win { border-color: #ef4444; }
    .ox-ans.revealed .sym:not(.win) { opacity: .18; }
    .ox-exp { min-height: 3.2em; text-align: center; font-size: clamp(1rem, 3.4vw, 1.4rem); font-weight: 600; padding: 4px 8px; }
    .ox-exp b { font-size: 1.15em; }
    .ox-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .ox-top .num { font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .ox-ans .sym.o { color: #93c5fd; }
      .ox-ans .sym.x { color: #fca5a5; }
    }
  </style>
</head>
<body data-game="ox">
  <header class="site-header">
    <a class="back" href="../">← 게임 목록</a>
    <h1>⭕ OX 퀴즈</h1>
    <span class="spacer"></span>
  </header>
  <main class="game" id="app"></main>

<script src="../assets/common.js?v=b8e111b3"></script>
<script src="questions.js?v=bbd376e4"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var root = $('#app'), main = root;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var CATS = window.OX_DATA.map(function (c) {
    return { name: c.cat, emoji: c.emoji, group: c.group || '일반', items: c.items.map(function (s) { var p = s.split('|'); return { q: p[0], a: p[1], e: p[2], c: c.cat }; }) };
  });
  var SELS = [
    { key: 'all', label: '🎲 전체', cats: CATS },
    { key: 'bible', label: '✝️ 성경만', cats: CATS.filter(function (c) { return c.group === '성경'; }) },
    { key: 'general', label: '일반 (성경 제외)', cats: CATS.filter(function (c) { return c.group !== '성경'; }) }
  ].concat(CATS.filter(function (c) { return c.group !== '성경'; }).map(function (c) { return { key: 'c:' + c.name, label: c.emoji + ' ' + c.name, cats: [c] }; }));
  function poolOf(s) { var a = []; s.cats.forEach(function (c) { a = a.concat(c.items); }); return a; }
  var S = Object.assign({ sel: 'general', secs: 20 }, MG.store.get('ox.settings', {}));
  if (!SELS.some(function (s) { return s.key === S.sel; })) S.sel = 'all';
  function save() { MG.store.set('ox.settings', S); }
  function curSel() { return SELS.filter(function (s) { return s.key === S.sel; })[0]; }

  var queue = [], cur = null, revealed = false, n = 0, tickId = null, deadline = 0, playing = false;
  function clearT() { clearInterval(tickId); tickId = null; }

  function renderSetup() {
    clearT(); playing = false; root.className = 'game'; MG.wake.off();
    root.innerHTML = '<div class="panel center"><div class="tr-emoji" style="margin:0">⭕❌</div><p class="tr-note" style="margin:4px 0 0">큰 화면에 문제를 띄우고, 참가자들은 O/X를 몸으로 표현해 보세요.\n(O는 팔로 동그라미, X는 팔로 엑스!)\n정답을 공개하면 해설이 나와요.</p></div>' +
      '<div class="panel"><h2>카테고리</h2><div class="chips" id="cats">' + SELS.map(function (s) { return '<button class="chip" type="button" data-k="' + s.key + '" aria-pressed="' + (s.key === S.sel) + '">' + s.label + ' <span style="opacity:.7">' + poolOf(s).length + '</span></button>'; }).join('') + '</div></div>' +
      '<div class="panel"><div class="field" style="margin:0"><span class="label">문제당 제한시간</span><div class="seg" id="tSeg">' + [[0, '끔'], [10, '10초'], [20, '20초'], [30, '30초']].map(function (o) { return '<button data-s="' + o[0] + '" aria-pressed="' + (S.secs === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div></div>' +
      '<button class="btn primary big wide" id="go" type="button">퀴즈 시작 ▶</button>';
    $('#cats').onclick = function (e) { var b = e.target.closest('.chip'); if (!b) return; S.sel = b.dataset.k; save(); root.querySelectorAll('#cats .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); };
    $('#tSeg').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; S.secs = +b.dataset.s; save(); root.querySelectorAll('#tSeg button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); };
    $('#go').onclick = function () { MG.unlockAudio(); queue = []; n = 0; MG.wake.on(); playing = true; next(); };
  }

  function next() {
    clearT();
    if (!queue.length) { queue = MG.shuffle(poolOf(curSel())); if (n > 0) MG.toast('모든 문제를 한 번씩 풀었어요. 다시 섞을게요!', 2200); }
    cur = queue.pop(); revealed = false; n++;
    root.className = 'game wide';
    root.innerHTML = '<div class="ox-top"><span class="num">' + n + '번째 문제</span><span class="muted" style="font-size:.85rem">' + esc(curSel().label) + '</span>' +
      '<button class="btn small" id="fs" type="button" aria-label="전체 화면">⛶ 전체 화면</button></div>' +
      '<div class="bar" id="bar" style="margin-top:8px"' + (S.secs ? '' : ' hidden') + '><i></i></div>' +
      '<div class="ox-q"><div class="cat">' + esc(cur.c) + '</div><div class="t">' + esc(cur.q) + '</div></div>' +
      '<div class="ox-ans" id="ans"><div class="sym o">O</div><div class="sym x">X</div></div>' +
      '<div class="ox-exp" id="exp" aria-live="polite">' + (S.secs ? '' : '생각해 보세요! 준비되면 정답을 공개하세요.') + '</div>' +
      '<div class="row center"><button class="btn primary big" id="rev" type="button">정답 공개 👀</button><button class="btn big" id="nx" type="button">다음 문제 ▶</button><button class="btn big" id="stop" type="button">그만하기</button></div>' +
      '<p class="hint">단축키: 스페이스/Enter = 정답 공개 → 다음 문제</p>';
    $('#rev').onclick = reveal; $('#nx').onclick = next; $('#stop').onclick = renderSetup;
    $('#fs').onclick = function () { try { var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () { MG.toast('전체 화면을 지원하지 않아요'); }); } catch (e) { MG.toast('전체 화면을 지원하지 않아요'); } };
    $('#nx').hidden = true;
    if (S.secs) {
      deadline = Date.now() + S.secs * 1000;
      tickId = setInterval(function () {
        var r = Math.max(0, (deadline - Date.now()) / 1000), b = $('#bar'); if (!b) return clearT();
        b.firstElementChild.style.width = (r / S.secs * 100) + '%'; b.classList.toggle('low', r <= 5);
        $('#exp').textContent = '⏱ ' + Math.ceil(r) + '초';
        if (r <= 0) { MG.beep(660, 300, .2); MG.vibrate(250); reveal(); }
      }, 200);
    }
  }
  function reveal() {
    if (revealed || !cur) return;
    revealed = true; clearT();
    var a = $('#ans'); a.classList.add('revealed');
    a.querySelector(cur.a === 'O' ? '.o' : '.x').classList.add('win');
    $('#exp').innerHTML = '<b>정답은 ' + cur.a + '!</b><br>' + esc(cur.e);
    var bar = $('#bar'); if (bar) bar.firstElementChild.style.width = '0%';
    $('#rev').hidden = true; $('#nx').hidden = false; $('#nx').focus();
    MG.beep(cur.a === 'O' ? 880 : 440, 160);
  }
  document.addEventListener('keydown', function (e) {
    if (!playing) return;
    if (e.key === ' ' || e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;  // 버튼 자체 동작에 맡겨요
      e.preventDefault(); if (!revealed) reveal(); else next();
    }
  });
  renderSetup();
})();
</script>
</body>
</html>
