<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=2966e46c">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/icons/icon.svg?v=ce2c3834">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon-180.png?v=8fe226b3">
  <link rel="manifest" href="../manifest.webmanifest?v=bb8c639b">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="미니게임">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>가위바위보 토너먼트 · Mini Games</title>
  <meta name="description" content="참가자를 무작위로 섞고 각 경기의 승자를 눌러 우승까지 진행해요.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../assets/style.css?v=fc901d82">
  <link rel="stylesheet" href="../assets/recreation.css?v=51d33eaa">
</head>
<body data-game="rps-bracket">
  <header class="site-header"><a class="back" href="../">← 게임 목록</a><h1>✌️ 가위바위보 토너먼트</h1><span class="spacer"></span></header>
  <main class="game rec-page">
    <section class="panel"><h2>참가자</h2><fieldset id="names" aria-label="토너먼트 참가자"></fieldset><p class="hint">빈칸은 빼고 2~64명으로 시작해요. 홀수 인원은 일부 참가자가 다음 라운드로 바로 올라가요.</p><button class="btn primary wide" id="generate" type="button">섞어서 대진 만들기</button></section>
    <p class="hint">서로 가위바위보를 하고, 각 경기의 승자 이름을 눌러 주세요. 비기면 한 번 더 해요. 다음 라운드가 만들어지면 이전 선택은 확정돼요.</p>
    <div class="hero" id="champion" role="status"></div><div id="bracket"></div>
    <button class="btn wide" id="reset" type="button">대진 초기화</button></main>
  <script src="../assets/common.js?v=b8e111b3"></script>
<script src="../assets/name-rows.js?v=6480ef27"></script>
<script src="logic.js?v=ebdd778b"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var L = window.BracketLogic;
  var stored = MG.store.get('rps-bracket.names', '');
  NameRows($('names'), '참가자', typeof stored === 'string' ? stored : '');
  var rounds = [];
  $('names').addEventListener('input', function () { MG.store.set('rps-bracket.names', this.value); });
  function render() {
    $('bracket').replaceChildren(); $('champion').textContent = '';
    rounds.forEach(function (matches, roundIndex) {
      var section = document.createElement('section'); section.className = 'panel';
      var heading = document.createElement('h2'); heading.textContent = (roundIndex + 1) + '라운드'; section.appendChild(heading);
      matches.forEach(function (match, index) {
        var row = document.createElement('div'); row.className = 'match';
        match.players.forEach(function (player) {
          var button = document.createElement('button'); button.type = 'button'; button.className = 'btn';
          button.textContent = player.name + (match.players.length === 1 ? ' · 다음 라운드로' : '');
          button.setAttribute('aria-pressed', match.winner === player.id ? 'true' : 'false');
          button.setAttribute('aria-label', player.name + ' · ' + (roundIndex + 1) + '라운드 ' + (index + 1) + '경기 승자');
          button.disabled = rounds.length - 1 !== roundIndex || match.players.length === 1;
          button.onclick = function () { choose(roundIndex, index, player.id); }; row.appendChild(button);
        });
        section.appendChild(row);
      });
      $('bracket').appendChild(section);
    });
    var last = rounds[rounds.length - 1];
    if (last && last.length === 1 && last[0].winner !== null) {
      $('champion').textContent = '🎉 ' + L.winners(last)[0].name + ' 우승!';
    }
  }
  function choose(round, index, id) {
    if (round !== rounds.length - 1) return;
    rounds[round][index].winner = id;
    if (rounds[round].every(function (m) { return m.winner !== null; }) && rounds[round].length > 1) rounds.push(L.makeRound(L.winners(rounds[round])));
    render();
  }
  $('generate').onclick = function () {
    var names = $('names').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (names.length < 2 || names.length > 64) { MG.toast('참가자를 2~64명 입력해 주세요'); return; }
    MG.store.set('rps-bracket.names', $('names').value);
    rounds = [L.makeRound(MG.shuffle(names.map(function (name, id) { return {name: name, id: id}; })))]; render();
  };
  $('reset').onclick = function () { rounds = []; render(); };
  render();
})();
</script>
<script data-goatcounter="https://mini-games.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
