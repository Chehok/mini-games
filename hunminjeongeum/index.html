<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=2966e46c">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/icons/icon.svg?v=ce2c3834">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon-180.png?v=8fe226b3">
  <link rel="manifest" href="../manifest.webmanifest?v=bb8c639b">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="미니게임">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>훈민정음 · Mini Games</title>
  <meta name="description" content="두 초성으로 시작하는 우리말을 말해요. 타이머와 2~4팀 점수판을 함께 써요.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../assets/style.css?v=222eebed">
  <link rel="stylesheet" href="../assets/recreation.css?v=51d33eaa">
</head>
<body data-game="hunminjeongeum">
  <header class="site-header"><a class="back" href="../">← 게임 목록</a><h1>🔠 훈민정음</h1><span class="spacer"></span></header>
  <main class="game rec-page">
    <section class="panel">
      <p class="hint">두 초성으로 시작하는 <strong>고유어(우리말)</strong>를 말해요. 한자어·외래어·이름은 빼고, 인정할 단어는 시작 전에 함께 정해 주세요. 예: ㄱㅅ → 구슬.</p>
      <div class="controls"><label>제한 시간<select class="input" id="seconds"><option value="30">30초</option><option value="60">60초</option></select></label><label>팀 수<select class="input" id="teamCount"><option value="2">2팀</option><option value="3">3팀</option><option value="4">4팀</option></select></label></div>
      <div class="hero" id="pair" aria-live="polite"></div>
      <p class="center" id="time" role="timer" style="font-size:2.5rem;font-weight:900"></p>
      <p class="center" id="timerStatus" role="status">시작을 눌러 주세요</p>
      <div class="controls"><button class="btn primary" id="start" type="button">타이머 시작</button><button class="btn" id="next" type="button">다음 초성</button></div>
    </section>
    <h2>팀 점수</h2><div class="team-scores" id="scores"></div>
    <button class="btn wide" id="reset" type="button">점수 초기화</button></main>
  <script src="../assets/common.js?v=b8e111b3"></script>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // 고유어 예시가 있는 조합만 사용해 진행이 막히지 않도록 해요.
  var initials = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  var pairs = ['구슬','나무','바람','하늘','마음','새벽','구름','노래','바다','오리','소금','자루','파랑','꼬마','다리','어미'].map(function (word) {
    return Array.from(word).map(function (letter) { return initials[Math.floor((letter.charCodeAt(0) - 0xac00) / 588)]; }).join('');
  });
  var points = MG.store.get('hunminjeongeum.scores', [0,0,0,0]);
  if (!Array.isArray(points) || points.length !== 4 || !points.every(Number.isFinite)) points = [0,0,0,0];
  var settings = MG.store.get('hunminjeongeum.settings', {});
  $('seconds').value = settings && settings.seconds === 60 ? '60' : '30';
  $('teamCount').value = settings && [2,3,4].includes(settings.teams) ? settings.teams : 2;
  var deadline = 0, last = '', queue = [];
  var timer = MG.Timer(function () { tick(); });
  function duration() { return +$('seconds').value; }
  function save() { MG.store.set('hunminjeongeum.scores', points); MG.store.set('hunminjeongeum.settings', { seconds: duration(), teams: +$('teamCount').value }); }
  function stop() { deadline = 0; timer.reset(); $('start').disabled = false; $('time').textContent = MG.fmtTime(duration()); }
  function tick() {
    if (!deadline) return;
    var remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    $('time').textContent = MG.fmtTime(remaining);
    if (!remaining) { deadline = 0; timer.stop(); $('timerStatus').textContent = '시간이 됐어요! 팀 점수를 기록해 주세요'; $('start').disabled = false; }
  }
  function next() {
    stop();
    if (!queue.length) { queue = MG.shuffle(pairs.slice()); if (queue[queue.length - 1] === last) queue.reverse(); }
    last = queue.pop(); $('pair').textContent = last; $('timerStatus').textContent = '시작을 눌러 주세요';
  }
  function renderScores() {
    $('scores').replaceChildren();
    for (var i = 0; i < +$('teamCount').value; i++) {
      (function (index) {
        var box = document.createElement('div'); box.className = 'panel';
        var name = document.createElement('h3'); name.textContent = (index + 1) + '팀';
        var score = document.createElement('strong'); score.textContent = points[index]; score.setAttribute('aria-live', 'polite');
        box.appendChild(name); box.appendChild(score);
        [-1, 1].forEach(function (delta) {
          var button = document.createElement('button'); button.type = 'button'; button.className = 'btn'; button.textContent = delta > 0 ? '＋1' : '−1';
          button.setAttribute('aria-label', (index + 1) + '팀 ' + (delta > 0 ? '1점 추가' : '1점 빼기'));
          button.onclick = function () { points[index] += delta; score.textContent = points[index]; save(); }; box.appendChild(button);
        });
        $('scores').appendChild(box);
      })(i);
    }
  }
  $('start').onclick = function () { stop(); deadline = Date.now() + duration() * 1000; timer.start(); $('start').disabled = true; $('timerStatus').textContent = '우리말을 말해 주세요!'; };
  $('next').onclick = next;
  $('seconds').onchange = function () { stop(); $('timerStatus').textContent = '시작을 눌러 주세요'; save(); };
  $('teamCount').onchange = function () { renderScores(); save(); };
  $('reset').onclick = function () { points = [0,0,0,0]; renderScores(); save(); };
  document.addEventListener('visibilitychange', tick);
  next(); renderScores();
})();
</script>
<script data-goatcounter="https://mini-games.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
