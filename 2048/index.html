<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=2966e46c">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/icons/icon.svg?v=ce2c3834">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon-180.png?v=8fe226b3">
  <link rel="manifest" href="../manifest.webmanifest?v=bb8c639b">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="미니게임">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>2048 · Mini Games</title>
  <meta name="description" content="방향키나 스와이프로 같은 숫자를 합쳐 2048 타일을 만드는 퍼즐 게임. 최고 점수와 되돌리기를 지원해요.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../assets/style.css?v=fc901d82">
  <style>
    .wrap { container-type: inline-size; width: min(100%, 440px); margin: 0 auto; }
    .board {
      position: relative; aspect-ratio: 1; padding: 2cqw; border-radius: 22px; border: 1px solid var(--border); box-shadow: var(--shadow);
      background: var(--surface-2); touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .board:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .inner { position: relative; width: 100%; height: 100%; }
    .bgcell, .tile { position: absolute; left: 0; top: 0; width: 25%; height: 25%; }
    .bgcell { transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%)); }
    .bgcell::after, .tile > div { content: ""; position: absolute; inset: 1.3cqw; border-radius: 8px; }
    .bgcell::after { background: color-mix(in srgb, var(--line-strong) 65%, var(--surface)); }
    .tile { transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%)); transition: transform .11s ease-in-out; z-index: 1; }
    .tile.top { z-index: 2; }
    .tile > div {
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 9cqw; color: var(--tile-ink); background: #f1eee9;
    }
    .tile.new > div { animation: appear .18s ease-out backwards; }
    .tile.merged > div { animation: bump .18s ease-out backwards; }
    @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .tile[data-v="2"] > div { background: #f1eee9; }
    .tile[data-v="4"] > div { background: #ece2ce; }
    .tile[data-v="8"] > div { background: #f2b179; color: var(--tile-ink); }
    .tile[data-v="16"] > div { background: #f59563; color: var(--tile-ink); }
    .tile[data-v="32"] > div { background: #f67c5f; color: var(--tile-ink); }
    .tile[data-v="64"] > div { background: #f65e3b; color: var(--tile-ink); }
    .tile[data-v="128"] > div { background: #edcf72; color: var(--tile-ink); font-size: 7.6cqw; }
    .tile[data-v="256"] > div { background: #edcc61; color: var(--tile-ink); font-size: 7.6cqw; }
    .tile[data-v="512"] > div { background: #edc850; color: var(--tile-ink); font-size: 7.6cqw; }
    .tile[data-v="1024"] > div { background: #edc53f; color: var(--tile-ink); font-size: 6.2cqw; }
    .tile[data-v="2048"] > div { background: #edc22e; color: var(--tile-ink); font-size: 6.2cqw; box-shadow: 0 0 20px 4px rgba(237, 194, 46, .7); }
    .tile.big > div { background: #3c3a32; color: #f9f6f2; font-size: 5.4cqw; }
  </style>
</head>
<body data-game="2048">
  <header class="site-header">
    <a class="back" href="../">← 게임 목록</a>
    <h1>🧮 2048</h1>
    <span class="spacer"></span>
  </header>
  <main class="game">
    <div class="statbar">
      <div class="stat"><span class="label">점수</span><span class="value" id="score">0</span></div>
      <div class="stat"><span class="label">최고 점수</span><span class="value" id="best">0</span></div>
    </div>
    <div class="wrap">
      <div class="board" id="board" tabindex="0" aria-label="2048 게임판"><div class="inner" id="inner"></div></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="undoBtn" disabled>↩ 되돌리기</button>
      <button class="btn primary" id="newBtn">새 게임</button>
    </div>
    <p class="hint">방향키(또는 WASD)나 화면 스와이프로 타일을 움직여요.</p>
  </main>

<script src="../assets/common.js?v=b8e111b3"></script>
<script>
(function () {
  'use strict';
  var N = 4, inner = document.getElementById('inner'), boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), undoBtn = document.getElementById('undoBtn');
  var tiles = [], nextId = 1, score = 0, best = MG.store.get('2048.best', 0);
  var snapshot = null, over = false, won = false, keepGoing = false, lock = false, pending = null, moveTimer = null;
  bestEl.textContent = best;

  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
    var bg = document.createElement('div'); bg.className = 'bgcell'; bg.style.setProperty('--r', r); bg.style.setProperty('--c', c);
    inner.appendChild(bg);
  }

  function makeTile(v, r, c, cls) {
    var t = { id: nextId++, v: v, r: r, c: c, el: document.createElement('div') };
    t.el.innerHTML = '<div></div>';
    t.el.firstChild.textContent = v;
    t.el.className = 'tile' + (cls ? ' ' + cls : '') + (v > 2048 ? ' big' : '');
    t.el.dataset.v = v;
    place(t); inner.appendChild(t.el);
    return t;
  }
  function place(t) { t.el.style.setProperty('--r', t.r); t.el.style.setProperty('--c', t.c); }

  function gridOf() {
    var g = []; for (var r = 0; r < N; r++) g.push(new Array(N).fill(null));
    tiles.forEach(function (t) { g[t.r][t.c] = t; });
    return g;
  }
  function values() { var g = gridOf(); return g.map(function (row) { return row.map(function (t) { return t ? t.v : 0; }); }); }

  function spawn() {
    var g = gridOf(), empty = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!g[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    var p = empty[Math.floor(Math.random() * empty.length)];
    tiles.push(makeTile(Math.random() < 0.9 ? 2 : 4, p[0], p[1], 'new'));
  }

  function canMove() {
    var v = values();
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      if (!v[r][c]) return true;
      if (c + 1 < N && v[r][c] === v[r][c + 1]) return true;
      if (r + 1 < N && v[r][c] === v[r + 1][c]) return true;
    }
    return false;
  }

  function setScore(s) {
    score = s; scoreEl.textContent = s;
    if (s > best) { best = s; bestEl.textContent = best; MG.store.set('2048.best', best); }
  }

  function clearBoard() { tiles.forEach(function (t) { t.el.remove(); }); tiles = []; }

  function newGame() {
    clearTimeout(moveTimer); moveTimer = null; tracking = false;
    clearBoard(); setScore(0); snapshot = null; over = false; won = false; keepGoing = false; lock = false; pending = null;
    undoBtn.disabled = true;
    spawn(); spawn();
    boardEl.focus({ preventScroll: true });
  }

  function lineCoords(dir, k) {
    var out = [], i;
    for (i = 0; i < N; i++) {
      if (dir === 'left') out.push([k, i]);
      else if (dir === 'right') out.push([k, N - 1 - i]);
      else if (dir === 'up') out.push([i, k]);
      else out.push([N - 1 - i, k]);
    }
    return out;
  }

  // Core: returns {moved, gained} and updates tile data. Pure on `list` of {r,c,v,...}.
  function computeMove(list, dir) {
    var g = []; for (var r = 0; r < N; r++) g.push(new Array(N).fill(null));
    list.forEach(function (t) { g[t.r][t.c] = t; });
    var moved = false, gained = 0, merges = [];
    for (var k = 0; k < N; k++) {
      var coords = lineCoords(dir, k), out = [];
      coords.forEach(function (p) {
        var t = g[p[0]][p[1]]; if (!t) return;
        var last = out[out.length - 1];
        if (last && !last.other && last.t.v === t.v) { last.other = t; gained += t.v * 2; }
        else out.push({ t: t, other: null });
      });
      out.forEach(function (o, i) {
        var p = coords[i];
        [o.t, o.other].forEach(function (t) {
          if (!t) return;
          if (t.r !== p[0] || t.c !== p[1]) moved = true;
          t.r = p[0]; t.c = p[1];
        });
        if (o.other) { moved = true; merges.push(o); }
      });
    }
    return { moved: moved, gained: gained, merges: merges };
  }

  function move(dir) {
    if (over) return;
    if (lock) { pending = dir; return; }
    var snap = { vals: values(), score: score };
    var res = computeMove(tiles, dir);
    if (!res.moved) { afterMove(); return; }
    snapshot = snap; undoBtn.disabled = false;
    tiles.forEach(place);
    var gone = [];
    res.merges.forEach(function (m) {
      gone.push(m.t, m.other);
      m.t.el.classList.add('top');
    });
    setScore(score + res.gained);
    lock = true;
    moveTimer = setTimeout(function () {
      moveTimer = null;
      res.merges.forEach(function (m) {
        m.t.el.remove(); m.other.el.remove();
        tiles = tiles.filter(function (t) { return t !== m.t && t !== m.other; });
        var nt = makeTile(m.t.v * 2, m.t.r, m.t.c, 'merged');
        tiles.push(nt);
        if (nt.v === 2048 && !won) { won = true; }
      });
      spawn();
      lock = false;
      afterMove();
      if (pending && !over) { var d = pending; pending = null; move(d); } else pending = null;
    }, 115);
  }

  function afterMove() {
    if (won && !keepGoing) {
      keepGoing = true;
      MG.dialog({
        title: '🎉 2048 달성!', text: '점수 ' + score + '점. 계속 도전해 볼까요?',
        buttons: [{ label: '계속하기', primary: true, onClick: afterMove }, { label: '새 게임', onClick: newGame }]
      });
      return;
    }
    if (!canMove()) {
      over = true;
      MG.dialog({
        title: '게임 오버', text: '더 이상 움직일 수 없어요.\n점수 ' + score + '점',
        buttons: [{ label: '새 게임', primary: true, onClick: newGame }, { label: '닫기' }]
      });
    }
  }

  function undo() {
    if (!snapshot || lock) return;
    clearBoard();
    snapshot.vals.forEach(function (row, r) { row.forEach(function (v, c) { if (v) tiles.push(makeTile(v, r, c, '')); }); });
    setScore(snapshot.score); snapshot = null; undoBtn.disabled = true; over = false;
  }

  /* input */
  var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('.overlay.show')) return;
    var d = KEYS[e.key];
    if (d) { e.preventDefault(); move(d); }
    else if ((e.key === 'z' || e.key === 'Z') ) undo();
  });

  var sx = 0, sy = 0, tracking = false;
  boardEl.addEventListener('pointerdown', function (e) { tracking = true; sx = e.clientX; sy = e.clientY; });
  window.addEventListener('pointerup', function (e) {
    if (!tracking) return; tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy, ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    if (ax > ay) move(dx > 0 ? 'right' : 'left'); else move(dy > 0 ? 'down' : 'up');
  });
  window.addEventListener('pointercancel', function () { tracking = false; });

  undoBtn.addEventListener('click', undo);
  document.getElementById('newBtn').addEventListener('click', newGame);

  window.Game2048 = { computeMove: computeMove, getValues: values, setValues: function (v) {
    clearTimeout(moveTimer); moveTimer = null; lock = false; pending = null;
    clearBoard(); v.forEach(function (row, r) { row.forEach(function (x, c) { if (x) tiles.push(makeTile(x, r, c, '')); }); });
  }, move: move };
  newGame();
})();
</script>
</body>
</html>
