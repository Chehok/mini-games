<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png?v=a0c25f63">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/icons/icon.svg?v=4f67c571">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon-180.png?v=36cae9cb">
  <link rel="manifest" href="../manifest.webmanifest?v=292da7b0">
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12141d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="미니게임">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>진행 도구 · Mini Games</title>
  <meta name="description" content="모임 진행 도구: 팀을 한 팀씩 공개하고, 사다리는 도착할 때 결과를 열고, 룰렛·슬롯으로 순서와 뽑기를 정해요.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../assets/style.css?v=82472e6e">
  <style>
    main.tools-page { max-width: 1040px; }
    .tabs { display: flex; justify-content: center; margin-bottom: 14px; max-width: 100%; }
    .tool-tabs { width: 100%; max-width: 720px; border-radius: 999px; padding: 4px; }
    .tool-tabs button {
      flex: 1 1 0; min-width: 0; border-radius: 999px; white-space: nowrap;
      padding: 10px 4px; font-size: clamp(.78rem, 2.8vw, 1rem);
    }
    .tool-tabs button[aria-selected="true"] {
      background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow);
    }
    .fs-btn { min-width: 44px; padding: 6px 10px; font-size: 1.05rem; }
    .tools-split { display: grid; gap: 12px; }
    @media (min-width: 880px) {
      .tools-split { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); align-items: start; }
      .lad-form-scroll { max-height: 70vh; overflow: auto; padding-right: 2px; }
    }
    @media (max-width: 879px) {
      .lad-layout .stage, .wheel-layout .stage { order: -1; }
    }
    html:fullscreen main.tools-page, html:-webkit-full-screen main.tools-page { max-width: 1180px; }
    .roster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .roster-head h2 { margin: 0; flex: 1; }
    .count-pill {
      background: var(--surface-2); color: var(--muted); border-radius: 999px;
      padding: 4px 10px; font-weight: 800; font-size: .85rem;
    }
    textarea.input.names {
      min-height: 132px; font-size: 1.05rem; line-height: 1.55; padding: 12px 14px;
      background: var(--surface-2);
    }
    .name-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .name-chips:empty { display: none; }
    .name-chip {
      background: var(--surface-2); border-radius: 999px; padding: 5px 10px;
      font-weight: 800; font-size: .92rem;
    }
    .name-chip .tag { color: var(--muted); font-weight: 700; margin-left: 4px; }
    .step-line { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
    .stepper .btn { width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 1.35rem; line-height: 1; }
    .stepper b { min-width: 2.4ch; text-align: center; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
    .check { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 44px; margin-top: 8px; }
    .check input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); }
    .teamgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 4px; }
    .team {
      background: var(--surface-2); border-radius: 18px; padding: 14px 14px 10px;
      border-top: 8px solid var(--c, var(--accent)); box-shadow: var(--shadow);
      animation: cardIn .42s cubic-bezier(.2,.8,.2,1) both;
    }
    .team h3 { margin: 0 0 6px; font-size: 1.3rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .team ul { margin: 0; padding: 0; list-style: none; }
    .team li { font-weight: 800; font-size: 1.2rem; padding: 7px 0; border-top: 1px solid var(--border); }
    .team li:first-child { border-top: 0; }
    .mixer { text-align: center; padding: 18px 8px 8px; min-height: 150px; }
    .mixer-name { font-size: clamp(2rem, 8vw, 3.4rem); font-weight: 900; color: var(--accent-ink); min-height: 1.15em; word-break: keep-all; }
    .lad-row { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 8px; }
    .lad-row .idx { font-weight: 900; text-align: center; font-size: 1.05rem; }
    .lad-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 18px; }
    .lad-inner {
      width: 100%; min-width: calc(var(--n, 4) * 68px);
      background: var(--surface-2); border-radius: 18px; padding: 8px 0 10px;
    }
    .lad-cols { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
    .lad-name {
      margin: 0 3px 8px; min-height: 48px; border: 0; border-radius: 12px;
      font-weight: 900; font-size: clamp(.72rem, 2.4vw, 1.05rem); padding: 6px 2px;
      word-break: keep-all; touch-action: manipulation;
    }
    .lad-name.done { opacity: .72; }
    .lad-scroll[data-busy="1"] .lad-name { pointer-events: none; }
    .prize {
      margin: 0 3px; min-height: 74px; border-radius: 14px; border: 2px dashed var(--border);
      background: var(--surface); display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 6px 2px; font-weight: 900;
    }
    .prize .what { font-size: clamp(.8rem, 2.5vw, 1.2rem); line-height: 1.2; word-break: keep-all; color: var(--muted); }
    .prize .who { font-size: clamp(.62rem, 2vw, .8rem); color: var(--c, var(--accent)); font-weight: 800; }
    .prize.on { border-style: solid; border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--surface)); }
    .prize.on .what { color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
    .actions .btn { min-height: 48px; }
    .reveal-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
    .reveal-list li {
      display: flex; align-items: center; gap: 10px; background: var(--surface-2);
      border-radius: 14px; padding: 12px 14px; font-weight: 800; font-size: 1.15rem;
      animation: cardIn .35s ease both;
    }
    .reveal-list .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .reveal-list .nm { flex: 1; min-width: 0; }
    .reveal-list .arr { color: var(--muted); }
    .wheel-stage { width: 100%; max-width: 540px; margin: 0 auto; }
    #wheel { width: 100%; height: auto; aspect-ratio: 1; }
    .result-hero {
      min-height: 4.8rem; display: grid; place-items: center; text-align: center;
      margin: 8px 0; font-weight: 900; font-size: clamp(1.35rem, 4vw, 2rem); color: var(--muted);
      word-break: keep-all;
    }
    .result-hero .pill {
      display: inline-block; max-width: 100%; padding: 10px 22px; border-radius: 22px;
      background: var(--win, var(--accent)); color: var(--win-ink, #fff);
      box-shadow: var(--shadow); animation: cardIn .35s cubic-bezier(.2,.9,.3,1) both;
    }
    .slot-wrap { text-align: center; }
    .slot-cap { text-align: center; font-weight: 800; margin: 12px 0 6px; color: var(--muted); }
    .slot-window {
      margin: 8px auto; max-width: 520px; min-height: 108px; border-radius: 22px;
      display: grid; place-items: center; padding: 12px 16px; position: relative; overflow: hidden;
      font-size: clamp(1.8rem, 7vw, 3.2rem); font-weight: 900; color: #fff; text-align: center;
      word-break: keep-all; line-height: 1.15;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.18), transparent 46%),
        linear-gradient(180deg, #1b2740, #101622);
      box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--accent) 70%, #000), var(--shadow);
    }
    .slot-window::before, .slot-window::after {
      content: ""; position: absolute; left: 0; right: 0; height: 26px; pointer-events: none;
    }
    .slot-window::before { top: 0; background: linear-gradient(#0008, transparent); }
    .slot-window::after { bottom: 0; background: linear-gradient(transparent, #0006); }
    .slot-window.landed {
      background: var(--accent); color: var(--accent-text);
      box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .ol { list-style: none; counter-reset: n; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
    .ol li {
      counter-increment: n; display: flex; gap: 10px; align-items: center;
      background: var(--surface-2); border-radius: 14px; padding: 12px 14px;
      font-weight: 800; font-size: 1.2rem; animation: cardIn .35s ease both;
    }
    .ol li::before {
      content: counter(n); display: grid; place-items: center; width: 1.8em; height: 1.8em;
      border-radius: 50%; background: var(--accent); color: var(--accent-text); font-size: .95rem; flex: none;
    }
    .pick-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
    .pick {
      display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 999px;
      background: var(--accent); color: var(--accent-text); font-weight: 900; font-size: 1.25rem;
      animation: cardIn .35s ease both;
    }
    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 80; }
    .confetti i { position: absolute; top: -16px; width: 10px; height: 14px; border-radius: 2px; animation: fall 1.15s ease-in forwards; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes fall { to { transform: translateY(105vh) rotate(400deg); opacity: .15; } }
    canvas { display: block; max-width: 100%; touch-action: manipulation; }
  </style>
</head>
<body data-game="tools">
  <header class="site-header">
    <a class="back" href="../">← 게임 목록</a>
    <h1>🧰 진행 도구</h1>
    <span class="spacer"><button class="btn small fs-btn" id="fs" type="button" aria-pressed="false" aria-label="전체 화면" title="전체 화면">⛶</button></span>
  </header>
  <main class="game tools-page">
    <div class="tabs">
      <div class="seg tool-tabs" id="tabs" role="tablist" aria-label="도구 선택">
        <button type="button" role="tab" id="btn-team" data-t="team" aria-controls="tab-team" aria-selected="true" tabindex="0">팀 나누기</button>
        <button type="button" role="tab" id="btn-ladder" data-t="ladder" aria-controls="tab-ladder" aria-selected="false" tabindex="-1">사다리</button>
        <button type="button" role="tab" id="btn-wheel" data-t="wheel" aria-controls="tab-wheel" aria-selected="false" tabindex="-1">룰렛</button>
        <button type="button" role="tab" id="btn-draw" data-t="draw" aria-controls="tab-draw" aria-selected="false" tabindex="-1">순서·뽑기</button>
      </div>
    </div>

    <section id="tab-team" role="tabpanel" aria-labelledby="btn-team">
      <div class="panel">
        <div class="roster-head">
          <h2>이름 목록</h2>
          <span class="count-pill" id="countA">0명</span>
          <button class="btn small" id="sampleA" type="button">예시</button>
        </div>
        <textarea class="input names" id="namesA" aria-label="이름 목록" placeholder="이름을 한 줄에 하나씩&#10;균형: 이름/태그 (예: 민수/남, 서연/여)"></textarea>
        <div class="name-chips" id="chipsA" aria-hidden="true"></div>
        <div class="step-line">
          <span class="muted" style="font-weight:800">팀 수</span>
          <div class="stepper">
            <button class="btn" id="tMinus" type="button" aria-label="팀 수 줄이기">−</button>
            <b id="tCnt">3</b>
            <button class="btn" id="tPlus" type="button" aria-label="팀 수 늘리기">＋</button>
          </div>
        </div>
        <button class="btn primary big wide" id="split" type="button">🎲 팀 나누기</button>
        <p class="hint" id="teamInfo" aria-live="polite">이름을 넣고 팀을 나눠 보세요. 이름/남 처럼 쓰면 태그별로 고르게 나뉩니다.</p>
        <div class="teamgrid" id="teams"></div>
        <div class="toolbar" id="teamTools" hidden><button class="btn small" id="copyTeams" type="button">📋 결과 복사</button></div>
      </div>
    </section>

    <section id="tab-ladder" role="tabpanel" aria-labelledby="btn-ladder" hidden>
      <div class="tools-split lad-layout">
        <div class="panel">
          <div class="step-line">
            <span class="muted" style="font-weight:800">인원</span>
            <div class="stepper">
              <button class="btn" id="lMinus" type="button" aria-label="인원 줄이기">−</button>
              <b id="lCnt">4</b>
              <button class="btn" id="lPlus" type="button" aria-label="인원 늘리기">＋</button>
            </div>
          </div>
          <h2>참가자 · 결과</h2>
          <div class="chips" style="margin-bottom:10px">
            <button class="chip" id="preWin" type="button">당첨·꽝</button>
            <button class="chip" id="preRank" type="button">1등~등수</button>
            <button class="chip" id="preClear" type="button">결과 지우기</button>
          </div>
          <div class="lad-form-scroll" id="lIn"></div>
          <p class="hint">비워 두면 1번은 당첨, 나머지는 꽝으로 둬요.</p>
        </div>
        <div class="panel stage">
          <div class="lad-scroll" id="ladScroll">
            <div class="lad-inner" id="ladInner">
              <div class="lad-cols" id="ladNames"></div>
              <canvas id="ladder" width="640" height="420" aria-hidden="true"></canvas>
              <div class="lad-cols" id="ladPrizes"></div>
            </div>
          </div>
          <p class="hint">이름을 누르면 그 사람만 내려가요. 결과는 도착하기 전까지 비밀이에요.</p>
          <div class="actions">
            <button class="btn" id="lAll" type="button">▶ 한 명씩 전체 공개</button>
            <button class="btn" id="lNew" type="button">🔀 사다리 새로 만들기</button>
            <button class="btn small" id="lCopy" type="button" hidden>📋 결과 복사</button>
          </div>
          <ul class="reveal-list" id="lRes" hidden></ul>
          <p class="sr-only" id="lLive" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section id="tab-wheel" role="tabpanel" aria-labelledby="btn-wheel" hidden>
      <div class="tools-split wheel-layout">
        <div class="panel">
          <div class="roster-head">
            <h2>룰렛 항목</h2>
            <span class="count-pill" id="countW">0개</span>
          </div>
          <textarea class="input names" id="wItems" aria-label="룰렛 항목" placeholder="항목을 한 줄에 하나씩"></textarea>
          <div class="name-chips" id="chipsW" aria-hidden="true"></div>
          <label class="check"><input type="checkbox" id="wRemove"> 뽑힌 항목은 룰렛에서 빼기</label>
        </div>
        <div class="panel stage">
          <div class="wheel-stage"><canvas id="wheel" width="640" height="640" aria-hidden="true"></canvas></div>
          <div class="result-hero" id="wRes" aria-live="polite"></div>
          <button class="btn primary big wide" id="spin" type="button">🎡 돌리기!</button>
          <p class="hint">화살표가 가리키는 칸이 결과예요.</p>
        </div>
      </div>
    </section>

    <section id="tab-draw" role="tabpanel" aria-labelledby="btn-draw" hidden>
      <div class="panel">
        <div class="roster-head">
          <h2>이름 목록</h2>
          <span class="count-pill" id="countB">0명</span>
          <button class="btn small" id="sampleB" type="button">예시</button>
        </div>
        <textarea class="input names" id="namesB" aria-label="이름 목록" placeholder="이름을 한 줄에 하나씩"></textarea>
        <div class="name-chips" id="chipsB" aria-hidden="true"></div>
      </div>
      <div class="panel">
        <h2>순서 정하기</h2>
        <button class="btn primary big wide" id="order" type="button">🔢 순서 정하기</button>
        <div class="slot-wrap" id="orderSlotWrap" hidden>
          <p class="slot-cap" id="orderCap">1번째</p>
          <div class="slot-window" id="orderSlot" aria-hidden="true">?</div>
          <button class="btn small" id="orderSkip" type="button" hidden>나머지 바로 보기</button>
        </div>
        <ol class="ol" id="orderList"></ol>
        <div class="toolbar" id="orderTools" hidden><button class="btn small" id="copyOrder" type="button">📋 순서 복사</button></div>
        <p class="sr-only" id="orderLive" aria-live="polite"></p>
      </div>
      <div class="panel">
        <h2>랜덤 뽑기</h2>
        <div class="step-line">
          <span class="muted" style="font-weight:800">뽑을 인원</span>
          <div class="stepper">
            <button class="btn" id="kMinus" type="button" aria-label="뽑을 인원 줄이기">−</button>
            <b id="kCnt">1</b>
            <button class="btn" id="kPlus" type="button" aria-label="뽑을 인원 늘리기">＋</button>
          </div>
        </div>
        <label class="check" style="justify-content:center"><input type="checkbox" id="kExclude"> 이미 뽑힌 사람은 제외</label>
        <button class="btn primary big wide" id="pick" type="button">🎯 뽑기!</button>
        <div class="slot-window" id="pickSlot" aria-hidden="true">누구?</div>
        <div class="pick-row" id="pickRes"></div>
        <p class="hint" id="pickInfo"></p>
        <div class="toolbar">
          <button class="btn small" id="pickReset" type="button" hidden>뽑기 기록 지우기</button>
          <button class="btn small" id="copyPick" type="button" hidden>📋 결과 복사</button>
        </div>
        <p class="sr-only" id="pickLive" aria-live="polite"></p>
      </div>
    </section>
  </main>

<script src="../assets/common.js?v=b8e111b3"></script>
<script src="logic.js?v=5f69812d"></script>
<script>
(function () {
  'use strict';
  var L = window.ToolsLogic;
  var $ = function (s) { return document.querySelector(s); };
  var COLORS = ['#ef4444', '#3b82f6', '#22a06b', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#64748b', '#84cc16'];
  var CANVAS_FONT = 'system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif';
  var SAMPLE = '민수\n지연\n태오\n하늘\n서연\n준호\n지우\n예린';
  var TABS = ['team', 'ladder', 'wheel', 'draw'];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function css(name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); }
  function prefersReduce() {
    return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function clampInt(v, a, b, d) {
    var n = parseInt(v, 10);
    if (isNaN(n)) n = d;
    return Math.max(a, Math.min(b, n));
  }
  function asArray(v) { return Array.isArray(v) ? v.slice() : []; }
  function ink(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    if (isNaN(r) || isNaN(g) || isNaN(b)) return '#ffffff';
    return (r * 299 + g * 587 + b * 114) / 1000 > 160 ? '#1f2333' : '#ffffff';
  }
  function segColor(i, n) {
    var c = COLORS[i % COLORS.length];
    if (n > 1 && i === n - 1 && c === COLORS[0]) return '#64748b';
    return c;
  }
  function mod(a, m) { return ((a % m) + m) % m; }
  function copyText(txt, okMsg) {
    MG.copy(txt).then(function (ok) { MG.toast(ok ? okMsg : '복사에 실패했어요'); });
  }
  function intoView(el) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (r.top >= 8 && r.bottom <= window.innerHeight - 8) return;
    try { el.scrollIntoView({ block: 'nearest', behavior: prefersReduce() ? 'auto' : 'smooth' }); }
    catch (e) { el.scrollIntoView(false); }
  }

  var job = 0, timers = [], rafId = 0;
  var spinning = false, playingAll = false, skipOrder = false;
  function later(fn, ms) {
    var id = setTimeout(fn, ms);
    timers.push(id);

    ln = clampInt(n, 2, 10, 4);

    while (lNames.length < ln) lNames.push('');
    while (lRes.length < ln) lRes.push('꽝');
    MG.store.set('tools.ladderNames', lNames);
    MG.store.set('tools.ladderRes', lRes);
    drawLadderInputs();
    rebuildLadder();
  }
  function setResults(arr) {
    lRes = arr.slice();
    while (lRes.length < ln) lRes.push('');
    MG.store.set('tools.ladderRes', lRes);
    drawLadderInputs();
    renderLadderChrome();
    syncListLabels();
    if (currentTab === 'ladder') drawLadder();
  }
  $('#lIn').addEventListener('input', function (e) {
    var el = e.target;
    if (!el || el.tagName !== 'INPUT') return;
    var i = +el.getAttribute('data-i');
    if (el.classList.contains('ln')) lNames[i] = el.value;
    else lRes[i] = el.value;
    MG.store.set('tools.ladderNames', lNames);
    MG.store.set('tools.ladderRes', lRes);
    var btn = $('#ladNames').children[i];
    if (btn && el.classList.contains('ln')) btn.textContent = ladName(i);
    if (el.classList.contains('lr')) {
      var card = $('#ladPrizes').children[i];
      if (card && card.classList.contains('on')) {
        var what = card.querySelector('.what');
        if (what) what.textContent = resultLabel(i);
      }
    }
    syncListLabels();
  });
  $('#ladNames').addEventListener('click', function (e) {
    var b = e.target.closest('.lad-name');
    if (!b) return;
    MG.unlockAudio();
    var i = +b.getAttribute('data-i');
    if (traces[i]) runOne(i, { replay: true });
    else runOne(i);
  });
  $('#lMinus').onclick = function () { setLn(ln - 1); };
  $('#lPlus').onclick = function () { setLn(ln + 1); };
  $('#lNew').onclick = function () { rebuildLadder(); MG.toast('새 사다리를 만들었어요'); };
  $('#lAll').onclick = function () {
    if (playingAll) { revealAllNow(); return; }
    var pending = false;
    for (var i = 0; i < ln; i++) if (!traces[i]) pending = true;
    if (!pending) return;
    MG.unlockAudio();
    showAll();
  };
  $('#lCopy').onclick = function () {
    var keys = Object.keys(traces).sort(function (a, b) { return (+a) - (+b); });
    copyText(keys.map(function (k) { return ladName(+k) + ' → ' + resultLabel(traces[k].end); }).join('\n'), '결과를 복사했어요');
  };
  $('#preWin').onclick = function () {
    var a = []; for (var i = 0; i < ln; i++) a.push(i === 0 ? '당첨' : '꽝'); setResults(a);
  };
  $('#preRank').onclick = function () {
    var a = []; for (var i = 0; i < ln; i++) a.push((i + 1) + '등'); setResults(a);
  };
  $('#preClear').onclick = function () {
    var a = []; for (var i = 0; i < ln; i++) a.push(''); setResults(a);
  };
  while (lNames.length < ln) lNames.push('');
  while (lRes.length < ln) lRes.push(lRes.length === 0 ? '당첨' : '꽝');
  MG.store.set('tools.ladderNames', lNames);
  MG.store.set('tools.ladderRes', lRes);
  ladder = L.buildLadder(ln);
  renderLadderChrome();
  drawLadderInputs();
  syncLadderActions();

  /* ---------- 룰렛 ---------- */
  var wStored = MG.store.get('tools.wheel', '치킨\n피자\n떡볶이\n라면\n햄버거');
  if (typeof wStored !== 'string') wStored = '치킨\n피자\n떡볶이\n라면\n햄버거';
  var wAngle = 0, wheelCache = null;
  $('#wItems').value = wStored;
  function renderWheelMeta() {
    var list = L.parseList($('#wItems').value);
    $('#countW').textContent = list.length + '개';
    $('#chipsW').innerHTML = list.map(function (s) { return '<span class="name-chip">' + esc(s) + '</span>'; }).join('');
    return list;
  }
  function fitLabel(ctx, text, maxPx, maxW) {
    var size = maxPx, t = text;
    while (size > 12) {
      ctx.font = '800 ' + size + 'px ' + CANVAS_FONT;
      if (ctx.measureText(t).width <= maxW) return { text: t, size: size };
      size -= 1;
    }
    ctx.font = '800 12px ' + CANVAS_FONT;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    if (t !== text) t += '…';
    return { text: t, size: 12 };
  }
  function drawWheel(angle) {
    var cv = $('#wheel');
    if (!cv || $('#tab-wheel').hidden) return;
    var S = cv.clientWidth;
    if (S < 20) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var pixels = Math.max(1, Math.round(S * dpr));
    if (cv.width !== pixels || cv.height !== pixels) { cv.width = pixels; cv.height = pixels; }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var source = $('#wItems').value;
    if (!wheelCache || wheelCache.source !== source || wheelCache.size !== S) {
      var parsed = L.parseList(source), radius = S / 2 - 22;
      var fontSize = Math.max(13, Math.round((parsed.length <= 5 ? 26 : parsed.length <= 8 ? 20 : 16) * (radius / 230)));
      wheelCache = { source: source, size: S, items: parsed, labels: parsed.map(function (text) { return fitLabel(ctx, text, fontSize, radius * 0.46); }) };
    }
    var items = wheelCache.items;
    var n = items.length;
    var cx = S / 2, cy = S / 2 + 2, R = S / 2 - 22;
    ctx.clearRect(0, 0, S, S);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.28)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(10, R - 1), 0, Math.PI * 2);
    ctx.fillStyle = css('--surface') || '#fff';
    ctx.fill();
    ctx.restore();
    if (!n) {
      ctx.fillStyle = css('--muted') || '#888';
      ctx.font = '700 18px ' + CANVAS_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('항목을 입력하세요', cx, cy);
      return;
    }
    var seg = Math.PI * 2 / n;
    var active = L.winnerIndex(angle, n);
    var surface = css('--surface') || '#fff';
    var i, a0, col;
    for (i = 0; i < n; i++) {
      a0 = angle + i * seg - Math.PI / 2;
      col = segColor(i, n);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      ctx.strokeStyle = surface;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(6, S * 0.018);
    ctx.strokeStyle = css('--text') || '#222';
    ctx.stroke();
    a0 = angle + active * seg - Math.PI / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R - Math.max(8, R * 0.06), a0 + seg * 0.16, a0 + seg * 0.84);
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.lineWidth = Math.max(3, R * 0.028);
    ctx.stroke();
    for (i = 0; i < n; i++) {
      var mid = angle + (i + 0.5) * seg - Math.PI / 2;
      var pose = L.labelPose(mid);
      var color = ink(segColor(i, n));
      var fitted = wheelCache.labels[i];
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(pose.rot);
      ctx.font = '800 ' + fitted.size + 'px ' + CANVAS_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, fitted.size * 0.18);
      ctx.strokeStyle = color === '#ffffff' ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.75)';
      ctx.lineJoin = 'round';
      ctx.strokeText(fitted.text, pose.x * R * 0.62, 0);
      ctx.fillStyle = color;
      ctx.fillText(fitted.text, pose.x * R * 0.62, 0);
      ctx.restore();
    }
    var hub = Math.max(16, R * 0.13);
    ctx.beginPath();
    ctx.arc(cx, cy, hub, 0, Math.PI * 2);
    ctx.fillStyle = surface;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = css('--accent') || '#0d9488';
    ctx.stroke();
    var pointerH = Math.max(22, Math.min(32, S * 0.055));
    var tipY = (cy - R) + 14;
    var baseY = Math.max(2, tipY - pointerH);
    ctx.beginPath();
    ctx.moveTo(cx, tipY);
    ctx.lineTo(cx - 15, baseY);
    ctx.lineTo(cx + 15, baseY);
    ctx.closePath();
    ctx.fillStyle = '#e5484d';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  }
  function showWin(items, idx) {
    var color = segColor(idx, items.length);
    $('#wRes').innerHTML = '<span class="pill" style="--win:' + color + ';--win-ink:' + ink(color) + '">' + esc(items[idx]) + '</span>';
    if (prefersReduce()) MG.beep(880, 150, 0.07);
    else { fanfare(); confetti(); }
    MG.vibrate([16, 30, 20]);
    if ($('#wRemove').checked) {
      var left = items.slice();
      left.splice(idx, 1);
      $('#wItems').value = left.join('\n');
      MG.store.set('tools.wheel', $('#wItems').value);
      renderWheelMeta();
      later(function () {
        if (spinning) return;
        wAngle = L.restAngle(L.parseList($('#wItems').value).length);
        if (currentTab === 'wheel') drawWheel(wAngle);
      }, prefersReduce() ? 0 : 1100);
    }
  }
  $('#wItems').addEventListener('input', function () {
    MG.store.set('tools.wheel', this.value);
    renderWheelMeta();
    if (!spinning) {
      wAngle = L.restAngle(L.parseList(this.value).length);
      $('#wRes').textContent = '';
      drawWheel(wAngle);
    }
  });
  $('#spin').onclick = function () {
    if (spinning) return;
    var items = L.parseList($('#wItems').value);
    var n = items.length;
    if (n < 2) { MG.toast('항목을 두 개 이상 입력해 주세요'); return; }
    MG.unlockAudio();
    var win = Math.floor(Math.random() * n);
    var turns = prefersReduce() ? 1 : (6 + Math.floor(Math.random() * 2));
    var end = L.spinTarget(wAngle, win, n, Math.random, turns);
    if (prefersReduce()) {
      stopMotion();
      wAngle = mod(end, Math.PI * 2);
      drawWheel(wAngle);
      showWin(items, L.winnerIndex(wAngle, n));
      return;
    }
    var id = stopMotion();
    spinning = true;
    $('#spin').disabled = true;
    $('#spin').textContent = '🎡 돌아가는 중…';
    $('#wItems').disabled = true;
    $('#wRes').textContent = '두근두근…';
    var from = wAngle;
    var start = performance.now();
    var dur = 5400;
    var lastIdx = L.winnerIndex(from, n);
    function step(now) {
      if (!alive(id)) return;
      var f = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - f, 4);
      wAngle = from + (end - from) * e;
      var idx = L.winnerIndex(wAngle, n);
      if (idx !== lastIdx) { lastIdx = idx; MG.beep(960, 16, 0.03); }
      drawWheel(wAngle);
      if (f < 1) rafId = requestAnimationFrame(step);
      else {
        wAngle = mod(end, Math.PI * 2);
        spinning = false;
        $('#wItems').disabled = false;
        $('#spin').disabled = false;
        $('#spin').textContent = '🎡 돌리기!';
        drawWheel(wAngle);
        showWin(items, L.winnerIndex(wAngle, n));
      }
    }
    rafId = requestAnimationFrame(step);
  };
  renderWheelMeta();
  wAngle = L.restAngle(L.parseList($('#wItems').value).length);

  /* ---------- 순서 · 뽑기 ---------- */
  function spinSlot(el, pool, winner, dur, id, done) {
    var doneCalled = false;
    function finish() {
      if (doneCalled || !alive(id)) return;
      doneCalled = true;
      el.textContent = winner;
      el.classList.add('landed');
      done();
    }
    el.classList.remove('landed');
    if (prefersReduce() || dur < 40) { el.textContent = winner; el.classList.add('landed'); done(); return; }
    var start = performance.now();
    var steps = 16;
    var last = -1;
    var held = false;
    function frame(now) {
      if (!alive(id)) return;
      var f = Math.min(1, (now - start) / dur);
      var ease = 1 - Math.pow(1 - f, 3);
      var idx = Math.min(steps - 1, Math.floor(ease * steps));
      if (idx !== last) {
        last = idx;
        if (idx === steps - 1) {
          el.textContent = winner;
          el.classList.add('landed');
          if (!held) { held = true; MG.beep(880, 120, 0.06); }
        } else {
          el.classList.remove('landed');
          el.textContent = pool[Math.floor(Math.random() * pool.length)];
          MG.beep(620 + (idx % 5) * 30, 14, 0.025);
        }
      }
      if (f < 1) rafId = requestAnimationFrame(frame);
      else finish();
    }
    rafId = requestAnimationFrame(frame);
  }
  function plainList(sel) {
    var out = [];
    L.parseList($(sel).value).forEach(function (s) { var n = L.plain(s); if (n) out.push(n); });
    return out;
  }
  $('#order').onclick = function () {
    var list = plainList('#namesB');
    if (list.length < 2) { MG.toast('이름을 두 명 이상 입력해 주세요'); return; }
    MG.unlockAudio();
    var id = stopMotion();
    skipOrder = false;
    var order = MG.shuffle(list.slice());
    var ul = $('#orderList');
    ul.innerHTML = '';
    $('#orderTools').hidden = true;
    $('#orderSlotWrap').hidden = false;
    $('#orderSkip').hidden = order.length <= 3 || prefersReduce();
    $('#order').disabled = true;
    $('#order').textContent = '정하는 중…';
    if (prefersReduce()) {
      ul.innerHTML = order.map(function (name) { return '<li>' + esc(name) + '</li>'; }).join('');
      $('#orderSlotWrap').hidden = true;
      $('#orderTools').hidden = false;
      $('#orderLive').textContent = '순서를 정했어요. 1번째는 ' + order[0] + '이에요.';
      $('#order').disabled = false;
      $('#order').textContent = '🔢 순서 정하기';
      return;
    }
    var i = 0;
    function finishOrder() {
      $('#orderSlotWrap').hidden = true;
      $('#orderSkip').hidden = true;
      $('#orderTools').hidden = false;
      $('#order').disabled = false;
      $('#order').textContent = '🔢 순서 정하기';
      $('#orderLive').textContent = '순서를 다 정했어요. 1번째는 ' + order[0] + '이에요.';
      fanfare();
    }
    function next() {
      if (!alive(id)) return;
      if (skipOrder) {
        while (i < order.length) {
          ul.insertAdjacentHTML('beforeend', '<li>' + esc(order[i]) + '</li>');
          i++;
        }
        finishOrder();
        return;
      }
      if (i >= order.length) { finishOrder(); return; }
      $('#orderCap').textContent = (i + 1) + '번째';
      var winner = order[i];
      var dur = i === 0 ? 1300 : Math.max(560, 1080 - i * 80);
      intoView($('#orderSlotWrap'));
      spinSlot($('#orderSlot'), list, winner, dur, id, function () {
        ul.insertAdjacentHTML('beforeend', '<li>' + esc(winner) + '</li>');
        $('#orderLive').textContent = (i + 1) + '번째는 ' + winner + '이에요.';
        i++;
        later(next, 140);
      });
    }
    next();
  };
  $('#orderSkip').onclick = function () { skipOrder = true; };
  $('#copyOrder').onclick = function () {
    var items = $('#orderList').querySelectorAll('li');
    var lines = [];
    for (var i = 0; i < items.length; i++) lines.push((i + 1) + '. ' + items[i].textContent);
    copyText(lines.join('\n'), '순서를 복사했어요');
  };

  var kn = clampInt(MG.store.get('tools.pickN', 1), 1, 20, 1), picked = [], lastPick = [];
  function setKn(n) { kn = clampInt(n, 1, 20, 1); $('#kCnt').textContent = String(kn); MG.store.set('tools.pickN', kn); }
  function updatePickInfo() {
    var list = plainList('#namesB');
    var on = $('#kExclude').checked && picked.length;
    $('#pickInfo').textContent = on ? ('지금까지 ' + picked.length + '명 / 전체 ' + list.length + '명') : '';
    $('#pickReset').hidden = !picked.length;
    $('#copyPick').hidden = !lastPick.length;
  }
  $('#kMinus').onclick = function () { setKn(kn - 1); };
  $('#kPlus').onclick = function () { setKn(kn + 1); };
  setKn(kn);
  $('#kExclude').addEventListener('change', updatePickInfo);
  $('#pickReset').onclick = function () {
    picked = [];
    updatePickInfo();
    MG.toast('뽑기 기록을 지웠어요');
  };
  $('#pick').onclick = function () {
    var list = plainList('#namesB');
    var pool = $('#kExclude').checked ? list.filter(function (x) { return picked.indexOf(x) < 0; }) : list.slice();
    if (!pool.length) {
      MG.toast(list.length ? '모두 뽑혔어요. 기록을 지우거나 제외를 꺼 보세요' : '이름을 입력해 주세요');
      return;
    }
    MG.unlockAudio();
    var id = stopMotion();
    var k = Math.min(kn, pool.length);
    var res = MG.shuffle(pool.slice()).slice(0, k);
    var exclude = $('#kExclude').checked;
    if (!exclude) picked = [];
    lastPick = [];
    $('#pickRes').innerHTML = '';
    $('#copyPick').hidden = true;
    $('#pick').disabled = true;
    $('#pick').textContent = '뽑는 중…';
    var i = 0;
    function add(name) {
      lastPick.push(name);
      if (exclude && picked.indexOf(name) < 0) picked.push(name);
      updatePickInfo();
      $('#pickRes').insertAdjacentHTML('beforeend', '<span class="pick">' + esc(name) + '</span>');
      $('#pickLive').textContent = name + ' 뽑혔어요.';
    }
    function finish() {
      $('#pick').disabled = false;
      $('#pick').textContent = '🎯 뽑기!';
      updatePickInfo();
      if (!prefersReduce()) confetti();
      else MG.beep(880, 120, 0.06);
    }
    function next() {
      if (!alive(id)) return;
      if (i >= res.length) { finish(); return; }
      var winner = res[i];
      if (prefersReduce()) { add(winner); i++; next(); return; }
      intoView($('#pickSlot'));
      spinSlot($('#pickSlot'), pool, winner, i === 0 ? 1400 : 900, id, function () {
        add(winner);
        i++;
        later(next, 200);
      });
    }
    next();
  };
  $('#copyPick').onclick = function () {
    if (!lastPick.length) return;
    copyText(lastPick.join(', '), '뽑기 결과를 복사했어요');
  };

  bindNames('#namesA');
  bindNames('#namesB');
  renderChips();

  var startTab = tabFromLocation();
  if (!startTab) {
    var saved = MG.store.get('tools.tab', '');
    if (TABS.indexOf(saved) >= 0) startTab = saved;
  }
  showTab(startTab || 'team');
  syncFs();

  var resizeRaf = 0;
  window.addEventListener('resize', function () {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(function () {
      resizeRaf = 0;
      if (currentTab === 'ladder') drawLadder();
      if (currentTab === 'wheel') drawWheel(wAngle);
    });
  });
  if (window.matchMedia) {
    var scheme = matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () {
      if (currentTab === 'ladder') drawLadder();
      if (currentTab === 'wheel') drawWheel(wAngle);
    };
    if (scheme.addEventListener) scheme.addEventListener('change', onScheme);
    else if (scheme.addListener) scheme.addListener(onScheme);
  }
})();
</script>
</body>
</html>
