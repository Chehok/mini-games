<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎮</text></svg>">
  <title>Mini Games</title>
  <meta name="description" content="스도쿠, 2048, 지뢰찾기, 슬라이드 퍼즐, 카드 짝맞추기, 워들까지! 설치 없이 바로 즐기는 미니 게임 모음.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="hub">
    <header>
      <h1>🎮 Mini Games</h1>
      <p>잠깐 쉬어갈 때, 하나 골라 볼까요?</p>
    </header>
    <nav class="cards" aria-label="게임 목록">
      <a class="card" href="sudoku/" style="--c:#3b82f6">
        <span class="emoji" aria-hidden="true">🔢</span>
        <div><h2>스도쿠</h2><p>빈칸을 채워 퍼즐을 완성하세요.</p></div>
      </a>
      <a class="card" href="2048/" style="--c:#f59e0b">
        <span class="emoji" aria-hidden="true">🧮</span>
        <div><h2>2048</h2><p>같은 숫자를 합쳐 2048을 만들어요.</p></div>
      </a>
      <a class="card" href="minesweeper/" style="--c:#10b981">
        <span class="emoji" aria-hidden="true">💣</span>
        <div><h2>지뢰찾기</h2><p>지뢰를 피해 모든 칸을 열어보세요.</p></div>
      </a>
      <a class="card" href="slide-puzzle/" style="--c:#8b5cf6">
        <span class="emoji" aria-hidden="true">🧩</span>
        <div><h2>슬라이드 퍼즐</h2><p>타일을 밀어 숫자 순서대로 맞춰요.</p></div>
      </a>
      <a class="card" href="memory/" style="--c:#ec4899">
        <span class="emoji" aria-hidden="true">🃏</span>
        <div><h2>카드 짝맞추기</h2><p>같은 그림의 카드 짝을 찾아요.</p></div>
      </a>
      <a class="card" href="wordle/" style="--c:#22a06b">
        <span class="emoji" aria-hidden="true">🔤</span>
        <div><h2>워들</h2><p>영어 5글자 단어를 6번 안에 맞혀요.</p></div>
      </a>
    </nav>
    <footer>광고도 설치도 없는 미니 게임 모음</footer>
  </div>
</body>
</html>
